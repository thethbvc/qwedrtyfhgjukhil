plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = '1.0.0'
group = 'com.example.serverstore'

base { archivesName = 'serverstore' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories { mavenCentral() }

neoForge {
    // CHECK https://projects.neoforged.net/neoforged/neoforge and use the newest 21.11.x version here
    version = '21.11.42'
    runs { server { server() } }
    mods { serverstore { sourceSet sourceSets.main } }
}
